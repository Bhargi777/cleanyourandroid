name: Bug
description: Something in the tools or the launcher does not work
labels: [bug]
body:
  - type: input
    id: device
    attributes:
      label: Device, Android version and skin
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Command and output
      description: The shortest output that shows the problem. Remove anything personal.
      render: text
